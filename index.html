var unit=function(p){var g=p.g,ar=S.lang==="ar";if(p.gl)return tx("u_"+p.t)+" "+(ar?p.gl.replace(/g/g,"غ"):p.gl);return tx("u_"+p.t)+" "+(g>=1000&&g%1000===0?(g/1000)+(ar?" كغ":" kg"):g+(ar?" غ":" g"))};
var sub=function(){return S.cart.reduce(function(s,l){var p=byId(l.id);return s+(p?p.p*l.q:0)},0)};
var ship=function(){var s=sub();if(s<=0||S.form.recv==="pickup")return 0;return s<FREE_FROM?FEE:0};
var count=function(){return S.cart.reduce(function(s,l){return s+l.q},0)};
var toastT;function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},1600)}

function statics(){
  var r=document.documentElement;r.lang=S.lang;r.dir=S.lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=tx(e.getAttribute("data-t"))});
  $("#langSel").value=S.lang;(function(){var n=SHOW[S.lang];$("#shT").textContent=n;$("#shP").textContent=DESC[9][S.lang].split("\n")[0];$(".show img").alt=n;$(".show [data-show]").textContent=tx("view")+" ›"})();$("#search").placeholder=tx("search");$("#cnt").textContent=count();$("#yr").textContent=new Date().getFullYear();
  document.title={fr:"Pâtisseries de Damas",en:"Pâtisseries de Damas",de:"Pâtisseries de Damas",ar:"حلويات الدمشقي"}[S.lang];
}
function chips(){
  if(!$("#chips"))return;
  $("#chips").innerHTML=['all'].concat(CATS).map(function(c){return '<button type="button" class="chip" data-cat="'+c+'" aria-pressed="'+(S.cat===c)+'">'+esc(c==="all"?tx("all"):tx("c_"+c))+"</button>"}).join("");
}
function matches(p){
  if(S.cat!=="all"&&p.c!==S.cat)return false;
  var q=S.q.trim().toLowerCase();if(!q)return true;
  return ["fr","en","de","ar"].some(function(l){return p[l].toLowerCase().indexOf(q)>=0});
}
function grid(){
  var list=P.filter(matches);
  $("#count").textContent=list.length+" "+(list.length===1?tx("one"):tx("many"));
  $("#grid").innerHTML=list.length?list.map(function(p){
    var n=name(p),alt=S.lang==="ar"?p.fr:p.ar;
    var ph=p.img?'<div class="ph"><img loading="lazy" src="img/'+p.img+'.jpg" alt="'+esc(n)+'"></div>':'<div class="ph none"><span>دمشقي</span><small>'+esc(tx("noPhoto"))+'</small></div>';
    return '<article class="card" data-id="'+p.id+'">'+ph+'<div class="body"><h3>'+esc(n)+'</h3>'+
      '<span class="alt" '+(S.lang==="ar"?'dir="ltr" style="text-align:start;font-family:var(--f-body)"':'dir="rtl" lang="ar" style="text-align:start"')+'>'+esc(alt)+'</span><span class="unit">'+esc(unit(p))+'</span>'+
      '<div class="pr"><b>'+money(p.p)+'</b><button type="button" class="btn sm" data-add>'+esc(tx("add"))+'</button></div><button type="button" class="more" data-view>'+esc(tx("view"))+" ›</button></div></article>";
  }).join(""):'<div class="empty">'+esc(tx("noRes"))+"</div>";
}
function all(){statics();chips();grid();if(S.drawer)drawer();if(S.dt)dt()}

function orderText(){
  var L=[T.fr.oHead,""];
  S.cart.forEach(function(l){var p=byId(l.id);if(p)L.push("- "+l.q+" x "+p.fr+" ("+unitFr(p)+") : "+money(p.p*l.q))});
  L.push("");L.push(T.fr.sub+" : "+money(sub()));L.push(T.fr.ship+" : "+(ship()?money(ship()):T.fr.free));L.push(T.fr.total+" : "+money(sub()+ship()));
  var f=S.form;L.push(T.fr.oCust+" : "+f.name+" / "+f.phone+(f.email?" / "+f.email:""));
  L.push(T.fr.oRecv+" : "+(f.recv==="delivery"?T.fr.delivery+", "+f.addr:T.fr.pickup));L.push(T.fr.oPay+" : "+T.fr["pay_"+f.pay]);
  if(f.notes)L.push(T.fr.oNotes+" : "+f.notes);return L.join("\n");
}
function unitFr(p){var g=p.g;if(p.gl)return T.fr["u_"+p.t]+" "+p.gl;return T.fr["u_"+p.t]+" "+(g>=1000&&g%1000===0?(g/1000)+" kg":g+" g")}

function drawer(){
  var h='<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="'+esc(tx("cartT"))+'"><div class="dh"><h3>'+esc(tx("cartT"))+'</h3><button type="button" class="x" data-close aria-label="'+esc(tx("close"))+'">×</button></div><div class="db">';
  if(!S.cart.length){h+='<div class="empty" style="grid-column:auto">'+esc(tx("empty"))+'<br><br><a class="btn ghost sm" href="#boutique" data-close>'+esc(tx("seeShop"))+"</a></div>"}
  else{
    S.cart.forEach(function(l){var p=byId(l.id);if(!p)return;
      h+='<div class="line" data-id="'+p.id+'">'+(p.img?'<img class="th" src="img/'+p.img+'.jpg" alt="">':'<div class="th none"></div>')+'<div><h4>'+esc(name(p))+'</h4><span class="unit">'+esc(unit(p))+'</span><div><div class="q"><button type="button" data-q="-1" aria-label="-">−</button><span>'+l.q+'</span><button type="button" data-q="1" aria-label="+">+</button></div></div></div><div class="lp"><b>'+money(p.p*l.q)+'</b><br><button type="button" class="rm" data-rm>'+esc(tx("remove"))+"</button></div></div>"});
    h+='<div class="tot"><div><span>'+esc(tx("sub"))+'</span><span>'+money(sub())+'</span></div><div><span>'+esc(tx("ship"))+'</span><span>'+(ship()?money(ship()):esc(tx("free")))+'</span></div><div class="g"><span>'+esc(tx("total"))+'</span><span>'+money(sub()+ship())+"</span></div></div>";
    if(!S.checkout)h+='<button type="button" class="btn" data-checkout>'+esc(tx("order"))+"</button>";
    else{var f=S.form;
      h+='<form id="of" novalidate><label>'+esc(tx("fName"))+'<input type="text" id="fName" autocomplete="name" value="'+esc(f.name)+'"></label>'+
      '<label>'+esc(tx("fPhone"))+'<input type="tel" id="fPhone" autocomplete="tel" dir="ltr" value="'+esc(f.phone)+'"></label>'+
      '<label>'+esc(tx("fEmail"))+'<input type="email" id="fEmail" autocomplete="email" dir="ltr" value="'+esc(f.email)+'"></label>'+
      '<fieldset><legend>'+esc(tx("fRecv"))+'</legend><label class="opt"><input type="radio" name="recv" id="rDel" value="delivery"'+(f.recv==="delivery"?" checked":"")+'>'+esc(tx("delivery"))+'</label><label class="opt"><input type="radio" name="recv" id="rPick" value="pickup"'+(f.recv==="pickup"?" checked":"")+'>'+esc(tx("pickup"))+"</label>"+
      (f.recv==="delivery"?'<label>'+esc(tx("fAddr"))+'<textarea id="fAddr">'+esc(f.addr)+"</textarea></label>":"")+"</fieldset>"+
      '<fieldset><legend>'+esc(tx("fPay"))+"</legend>"+["twint","invoice","cash"].filter(function(k){return !(k==="cash"&&f.recv==="delivery")}).map(function(k){return '<label class="opt"><input type="radio" name="pay" id="p_'+k+'" value="'+k+'"'+(f.pay===k?" checked":"")+">"+esc(tx("pay_"+k))+"</label>"}).join("")+'<span class="note">'+esc(tx("payNote"))+"</span></fieldset>"+
      '<label>'+esc(tx("fNotes"))+'<textarea id="fNotes">'+esc(f.notes)+"</textarea></label>"+(S.err?'<div class="err" role="alert">'+esc(S.err)+"</div>":"")+'<button type="submit" class="btn">'+esc(tx("prepare"))+"</button></form>";
      if(S.ready)h+='<div class="result"><b>'+esc(tx("readyT"))+'</b><span class="note">'+esc(tx("readyText"))+'</span><pre id="pre">'+esc(S.ready)+'</pre><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+WA+"?text="+encodeURIComponent(S.ready)+'">'+esc(tx("sendWA"))+'</a><button type="button" class="btn ghost" data-copy>'+esc(tx("copy"))+"</button></div>";
    }
  }
  h+="</div></aside>";
  var sc=($(".db")||{}).scrollTop||0;$("#layer").innerHTML=h;var d=$(".db");if(d)d.scrollTop=sc;
}
function openD(){S.drawer=true;S.ready=null;S.err="";drawer();var b=$(".dh .x");if(b)b.focus()}
function closeD(){S.drawer=false;$("#layer").innerHTML=""}
function persist(){save();$("#cnt").textContent=count()}


var DESC={9:{
ar:"طبقات من عجينة الفيلو الرقيقة محشوة بفستق حلبي مجروش وسمن طبيعي، تُسقى بالشهد بعد الخروج من الفرن. قرمشة من الأعلى وطراوة من الداخل.\nهذه هي البقلاوة التي نبدأ بها كل صباح: عشرات الطبقات الرقيقة تُصفّ واحدة فوق أخرى قبل أن تُقطَّع بالمقاس.",
fr:"Des couches de pâte filo très fine garnies de pistache d’Alep concassée et de beurre clarifié naturel, arrosées de sirop de miel à la sortie du four. Croustillant dessus, moelleux à l’intérieur.\nC’est la baklava par laquelle nous commençons chaque matin : des dizaines de couches fines superposées une à une avant d’être découpées à la taille voulue.",
en:"Layers of paper-thin filo filled with crushed Aleppo pistachios and natural clarified butter, drenched in honey syrup as soon as they leave the oven. Crisp on top, soft inside.\nThis is the baklava we start with every morning: dozens of thin layers stacked one by one before being cut to size.",
de:"Schichten aus hauchdünnem Filo-Teig, gefüllt mit gehackten Aleppo-Pistazien und natürlichem Butterschmalz, frisch aus dem Ofen mit Honigsirup getränkt. Knusprig oben, weich innen.\nMit dieser Baklava beginnen wir jeden Morgen: Dutzende dünner Schichten, eine nach der anderen aufgeschichtet und dann in Form geschnitten."}};
var SHOW={fr:"Tous les types de plateaux",en:"All types of trays",de:"Alle Sorten auf dem Blech",ar:"جميع أنواع الدكمه"};
function dt(){
  var sh=S.dt==="show",p=sh?{id:0,img:"dakma",fr:SHOW.fr,en:SHOW.en,de:SHOW.de,ar:SHOW.ar,c:"b"}:byId(S.dt),e=$("#dt");
  if(!p){if(e)e.remove();document.body.style.overflow="";return}
  if(!e){e=document.createElement("div");e.id="dt";e.className="dt";e.setAttribute("role","dialog");e.setAttribute("aria-modal","true");document.body.appendChild(e)}
  var n=name(p),alt=S.lang==="ar"?p.fr:p.ar,d=DESC[9][S.lang];
  var rel=P.filter(function(x){return x.id!==p.id}).sort(function(a,b){return((b.c===p.c)-(a.c===p.c))||((b.img?1:0)-(a.img?1:0))}).slice(0,4);
  var seen={},gal=P.filter(function(x){if(!x.img||seen[x.img])return false;seen[x.img]=1;return true});
  var h='<div class="dtin"><div class="dtbar"><button type="button" class="btn ghost sm" data-dtc>‹ '+esc(tx("close"))+'</button></div><div class="dtg">'+
   '<div class="dimg"><img src="img/dakma.jpg" alt="'+esc(n)+'"></div>'+
   '<div class="dinfo"><h2>'+esc(n)+'</h2><span class="alt" '+(S.lang==="ar"?'dir="ltr" style="text-align:start;font-family:var(--f-body)"':'dir="rtl" lang="ar" style="text-align:start"')+'>'+esc(alt)+'</span>'+(sh?'<a class="btn" style="margin-top:14px" target="_blank" rel="noopener" href="https://wa.me/'+WA+'">'+esc(tx("wsT"))+'</a>':'<span class="unit">'+esc(unit(p))+'</span><div class="dpr">'+money(p.p)+'</div><button type="button" class="btn" data-dadd>'+esc(tx("add"))+'</button>')+'<div class="ddesc">'+d.split("\n").map(function(x){return"<p>"+esc(x)+"</p>"}).join("")+'</div></div></div>'+
   '<h3 class="dh3">'+esc(tx("rel"))+'</h3><div class="rel">'+rel.map(function(x){return'<button type="button" class="rc" data-go="'+x.id+'">'+(x.img?'<img loading="lazy" src="img/'+x.img+'.jpg" alt="">':'<span class="rn">دمشقي</span>')+'<span class="rt">'+esc(name(x))+'</span><b>'+money(x.p)+'</b></button>'}).join("")+'</div>'+
   '<h3 class="dh3">'+esc(tx("gal"))+'</h3><div class="gal">'+gal.map(function(x){return'<img loading="lazy" src="img/'+x.img+'.jpg" alt="'+esc(name(x))+'">'}).join("")+'</div></div>';
  var top=e.scrollTop;e.innerHTML=h;e.scrollTop=top;document.body.style.overflow="hidden";
}
function openDt(id){S.dt=id;dt();var e=$("#dt");if(e)e.scrollTop=0;var b=e&&e.querySelector("[data-dtc]");if(b)b.focus()}
function closeDt(){S.dt=null;dt()}
var lb=[],li=0;
function lbShow(){var e=$("#lb");if(!e){e=document.createElement("div");e.id="lb";e.className="lb";e.setAttribute("role","dialog");e.setAttribute("aria-modal","true");document.body.appendChild(e)}
  var it=lb[li];e.innerHTML='<img src="'+esc(it.src)+'" alt="'+esc(it.alt)+'"><div class="cap">'+esc(it.alt)+'</div><button type="button" class="cl" data-lbc aria-label="x">×</button>'+(lb.length>1?'<button type="button" class="pv" data-lbp aria-label="‹">‹</button><button type="button" class="nx" data-lbn aria-label="›">›</button>':"");var b=e.querySelector(".cl");if(b)b.focus()}
function lbStep(d){li=(li+d+lb.length)%lb.length;lbShow()}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest("#lb")){if(t.closest("[data-lbp]"))lbStep(S.lang==="ar"?1:-1);else if(t.closest("[data-lbn]"))lbStep(S.lang==="ar"?-1:1);else if(t.tagName!=="IMG"){var l=$("#lb");if(l)l.remove()}return}
  var im=t.closest(".ph img,.hero img,.story img,.dimg img,.gal img,.show img");
  if(im){var set=im.closest(".ph")?[].slice.call(document.querySelectorAll(".ph img")):im.closest(".gal")?[].slice.call(document.querySelectorAll(".gal img")):[im];lb=set.map(function(x){return{src:x.getAttribute("src"),alt:x.alt}});li=set.indexOf(im);lbShow();return}
  var shw=t.closest("[data-show]");if(shw){e.preventDefault();openDt("show");return}
  var gv=t.closest("[data-go]");if(gv){S.dt=Number(gv.dataset.go);dt();var de=$("#dt");if(de)de.scrollTop=0;return}
  if(t.closest("[data-dtc]")){closeDt();return}
  if(t.closest("[data-dadd]")){var ai=S.dt,al=S.cart.filter(function(l){return l.id===ai})[0];if(al)al.q++;else S.cart.push({id:ai,q:1});persist();toast(tx("added"));return}
  var vw=t.closest(".card [data-view],.card h3");if(vw){openDt(Number(vw.closest(".card").dataset.id));return}
  var b=t.closest("button,a");if(!b)return;
  if(b.id==="openCart"||b.id==="footCart"){e.preventDefault();openD();return}
  if(b.hasAttribute("data-close")){closeD();return}
  if(b.dataset.cat){S.cat=b.dataset.cat;chips();grid();return}
  var card=b.closest(".card");
  if(card&&b.hasAttribute("data-add")){var id=Number(card.dataset.id),ln=S.cart.filter(function(l){return l.id===id})[0];if(ln)ln.q++;else S.cart.push({id:id,q:1});persist();toast(tx("added"));return}
  var line=b.closest(".line");
  if(line&&b.dataset.q){var i2=Number(line.dataset.id),l2=S.cart.filter(function(l){return l.id===i2})[0];l2.q+=Number(b.dataset.q);if(l2.q<1)S.cart=S.cart.filter(function(l){return l.id!==i2});S.ready=null;persist();drawer();return}
  if(line&&b.hasAttribute("data-rm")){var i3=Number(line.dataset.id);S.cart=S.cart.filter(function(l){return l.id!==i3});S.ready=null;persist();drawer();return}
  if(b.hasAttribute("data-checkout")){S.checkout=true;drawer();return}
  if(b.hasAttribute("data-copy")){var fb=function(){var r=document.createRange();r.selectNodeContents($("#pre"));var s=getSelection();s.removeAllRanges();s.addRange(r);toast(tx("copyFail"))};try{navigator.clipboard.writeText(S.ready).then(function(){toast(tx("copied"))},fb)}catch(x){fb()}}
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="search"){S.q=el.value;grid();return}
  if(!el.closest("#of"))return;var m={fName:"name",fPhone:"phone",fEmail:"email",fAddr:"addr",fNotes:"notes"};if(m[el.id]){S.form[m[el.id]]=el.value;S.ready=null;save()}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="langSel"){S.lang=el.value;save();all();return}
  if(el.name==="recv"){S.form.recv=el.value;if(el.value==="delivery"&&S.form.pay==="cash")S.form.pay="twint";S.ready=null;save();drawer()}
  if(el.name==="pay"){S.form.pay=el.value;S.ready=null;save()}
});
document.addEventListener("submit",function(e){
  if(e.target.id!=="of")return;e.preventDefault();var f=S.form;S.err="";
  if(!f.name.trim())S.err=tx("eName");else if(!f.phone.trim())S.err=tx("ePhone");else if(f.recv==="delivery"&&!f.addr.trim())S.err=tx("eAddr");
  S.ready=S.err?null:orderText();drawer();var r=$(".result")||$(".err");if(r)r.scrollIntoView({block:"nearest"});
});
document.addEventListener("keydown",function(e){
  if($("#lb")){if(e.key==="Escape"){$("#lb").remove();e.stopPropagation()}else if(e.key==="ArrowRight")lbStep(S.lang==="ar"?-1:1);else if(e.key==="ArrowLeft")lbStep(S.lang==="ar"?1:-1);return}
  if(e.key==="Escape"){if(S.drawer)closeD();else if(S.dt)closeDt()}
},true);
all();
})();
</script>

</body></html>
